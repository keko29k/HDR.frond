<div class="page">

  <header class="header">
    <div>
      <h2>Marcas</h2>
      <p>{{ meta.totalCount }} {{ meta.totalCount === 1 ? 'marca registrada' : 'marcas registradas' }}</p>
    </div>

    <button type="button" class="btn primary" (click)="nuevo()">
      <mat-icon>add</mat-icon>
      Nueva Marca
    </button>
  </header>

  <mat-card class="card">

    <div class="toolbar">
      <mat-form-field appearance="outline" class="search" subscriptSizing="dynamic">
        <mat-label>Buscar marca</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput type="text" [formControl]="buscarControl" placeholder="Buscar por nombre o descripción">
      </mat-form-field>
    </div>

    <div class="table-wrap">

      <div class="loading-overlay" *ngIf="loading">
        <mat-spinner diameter="32"></mat-spinner>
      </div>

      <table mat-table [dataSource]="marcas" class="table" *ngIf="!loading">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let marca" class="mono faint">{{ marca.id }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let marca" class="strong">{{ marca.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let marca" class="wrap">
            <span *ngIf="marca.descripcion; else sinDescripcion">{{ marca.descripcion }}</span>
            <ng-template #sinDescripcion>
              <span class="texto-vacio">Sin descripción</span>
            </ng-template>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="right">Acciones</th>
          <td mat-cell *matCellDef="let marca" class="acciones right">
            <button mat-stroked-button color="primary" type="button" (click)="editar(marca.id)">
              <mat-icon>edit</mat-icon>
              Editar
            </button>
            <button mat-stroked-button color="warn" type="button" (click)="eliminar(marca.id)">
              <mat-icon>delete</mat-icon>
              Eliminar
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr *ngIf="marcas.length === 0">
          <td [attr.colspan]="displayedColumns.length" class="empty">
            <mat-icon>branding_watermark</mat-icon>
            <span>No se encontraron marcas.</span>
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      *ngIf="!loading"
      [length]="meta.totalCount"
      [pageSize]="meta.pageSize"
      [pageIndex]="meta.currentPage - 1"
      [pageSizeOptions]="[5, 10, 20, 50]"
      showFirstLastButtons
      (page)="cambiarPagina($event)">
    </mat-paginator>

  </mat-card>
</div>
