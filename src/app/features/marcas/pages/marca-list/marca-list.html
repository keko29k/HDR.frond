<mat-card class="list-card">

  <!-- ==========================================
       ENCABEZADO
       ========================================== -->

  <div class="header">

    <div class="header-info">

      <h2>Marcas</h2>

      <p>
        Administración de marcas
      </p>

    </div>

    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="nuevo()">

      Nueva Marca

    </button>

  </div>


  <!-- ==========================================
       BUSCADOR
       ========================================== -->

  <div class="filtros">

    <mat-form-field
      appearance="outline"
      class="buscador">

      <mat-label>Buscar marca</mat-label>

      <input
        matInput
        type="text"
        [formControl]="buscarControl"
        placeholder="Buscar por nombre">

    </mat-form-field>

  </div>


  <!-- ==========================================
       CONTENEDOR PRINCIPAL
       ========================================== -->

  <div class="contenido">


    <!-- ========================================
         LOADING
         ======================================== -->

    <div
      class="loading-container"
      *ngIf="loading">

      <mat-spinner
        diameter="45">
      </mat-spinner>

      <span>
        Cargando marcas...
      </span>

    </div>


    <!-- ========================================
         TABLA
         ======================================== -->

    <div
      class="table-container"
      *ngIf="!loading">

      <table
        mat-table
        [dataSource]="marcas"
        class="tabla">


        <!-- ====================================
             COLUMNA ID
             ==================================== -->

        <ng-container matColumnDef="id">

          <th
            mat-header-cell
            *matHeaderCellDef>

            ID

          </th>

          <td
            mat-cell
            *matCellDef="let marca">

            {{ marca.id }}

          </td>

        </ng-container>


        <!-- ====================================
             COLUMNA NOMBRE
             ==================================== -->

        <ng-container matColumnDef="nombre">

          <th
            mat-header-cell
            *matHeaderCellDef>

            Nombre

          </th>

          <td
            mat-cell
            *matCellDef="let marca">

            {{ marca.nombre }}

          </td>

        </ng-container>


        <!-- ====================================
             COLUMNA DESCRIPCIÓN
             ==================================== -->

        <ng-container matColumnDef="descripcion">

          <th
            mat-header-cell
            *matHeaderCellDef>

            Descripción

          </th>

          <td
            mat-cell
            *matCellDef="let marca">

            <span
              *ngIf="marca.descripcion; else sinDescripcion">

              {{ marca.descripcion }}

            </span>

            <ng-template #sinDescripcion>

              <span class="texto-vacio">
                Sin descripción
              </span>

            </ng-template>

          </td>

        </ng-container>


        <!-- ====================================
             COLUMNA ACCIONES
             ==================================== -->

        <ng-container matColumnDef="acciones">

          <th
            mat-header-cell
            *matHeaderCellDef>

            Acciones

          </th>

          <td
            mat-cell
            *matCellDef="let marca"
            class="acciones">


            <!-- EDITAR -->

            <button
              mat-stroked-button
              color="primary"
              type="button"
              (click)="editar(marca.id)">

              Editar

            </button>


            <!-- ELIMINAR -->

            <button
              mat-stroked-button
              color="warn"
              type="button"
              (click)="eliminar(marca.id)">

              Eliminar

            </button>

          </td>

        </ng-container>


        <!-- ====================================
             ENCABEZADO DE LA TABLA
             ==================================== -->

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns">

        </tr>


        <!-- ====================================
             FILAS DE LA TABLA
             ==================================== -->

        <tr
          mat-row
          *matRowDef="
            let row;
            columns: displayedColumns;
          ">

        </tr>


        <!-- ====================================
             SIN REGISTROS
             ==================================== -->

        <tr
          *ngIf="marcas.length === 0">

          <td
            [attr.colspan]="displayedColumns.length"
            class="sin-datos">

            No se encontraron marcas.

          </td>

        </tr>

      </table>

    </div>


    <!-- ========================================
         PAGINACIÓN
         ======================================== -->

    <mat-paginator
      *ngIf="!loading"

      [length]="meta.totalCount"

      [pageSize]="meta.pageSize"

      [pageIndex]="meta.currentPage - 1"

      [pageSizeOptions]="[5, 10, 20, 50]"

      showFirstLastButtons

      (page)="cambiarPagina($event)">

    </mat-paginator>


  </div>

</mat-card>
