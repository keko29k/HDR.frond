<div class="page-container">
  <mat-card class="table-card">

    <div class="header">
      <h2>Lista de Categorias</h2>

      <button mat-raised-button color="primary" (click)="nuevo()">
        Nuevo Categoria
      </button>
    </div>

    <div class="filters">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar Categoria</mat-label>
        <input matInput [formControl]="buscarControl" placeholder="Nombre" />
      </mat-form-field>
    </div>

    <!-- LOADING -->
    <div class="loading-container" *ngIf="loading">
      <mat-spinner diameter="42"></mat-spinner>
    </div>

    <!-- TABLA -->
    <div class="table-container" *ngIf="!loading">
      <table mat-table [dataSource]="categorias" class="full-width-table mat-elevation-z1">

        <!-- ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let categoria">{{ categoria.id }}</td>
        </ng-container>

        <!-- NOMBRE -->
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let categoria">
            {{ categoria.nombre }}
          </td>
        </ng-container>

        <!-- EMAIL -->
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Correo</th>
          <td mat-cell *matCellDef="let categoria">
            {{ categoria.descripcion }}
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
  <th mat-header-cell *matHeaderCellDef>Acciones</th>

  <td mat-cell *matCellDef="let categoria" class="actions-cell">

    <button mat-icon-button color="primary"
            (click)="editar(categoria.id)"
            matTooltip="Editar">
      <mat-icon>edit</mat-icon>
    </button>

    <button mat-icon-button color="warn"
            (click)="eliminar(categoria.id)"
            matTooltip="Eliminar">
      <mat-icon>delete</mat-icon>
    </button>

  </td>
</ng-container>

       

        <!-- FILAS -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row"></tr>
      </table>

      <!-- EMPTY -->
      <div class="empty-state" *ngIf="categorias.length === 0">
        No se encontraron categorias.
      </div>
    </div>

    <!-- PAGINADOR -->
    <mat-paginator
      [length]="meta.totalCount"
      [pageSize]="meta.pageSize"
      [pageIndex]="meta.currentPage - 1"
      [pageSizeOptions]="[5, 10, 20, 50]"
      showFirstLastButtons
      (page)="cambiarPagina($event)">
    </mat-paginator>

  </mat-card>
</div>
