<div class="page">

  <header class="header">
    <div>
      <h2>Categorías</h2>
      <p>{{ meta.totalCount }} {{ meta.totalCount === 1 ? 'categoría registrada' : 'categorías registradas' }}</p>
    </div>

    <button type="button" class="btn primary" (click)="nuevo()">
      <mat-icon>add</mat-icon>
      Nueva categoría
    </button>
  </header>

  <mat-card class="card">

    <div class="toolbar">
      <mat-form-field appearance="outline" class="search" subscriptSizing="dynamic">
        <mat-label>Buscar categoría</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [formControl]="buscarControl" placeholder="Nombre o descripción">
      </mat-form-field>
    </div>

    <div class="table-wrap">

      <div class="loading-overlay" *ngIf="loading">
        <mat-spinner diameter="32"></mat-spinner>
      </div>

      <table mat-table [dataSource]="categorias" class="table" *ngIf="!loading">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let categoria" class="mono faint">{{ categoria.id }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let categoria" class="strong">{{ categoria.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let categoria" class="wrap">{{ categoria.descripcion || 'Sin descripción' }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="right">Acciones</th>
          <td mat-cell *matCellDef="let categoria" class="acciones right">
            <button mat-icon-button type="button" class="icon-btn" [attr.aria-label]="'Editar ' + categoria.nombre" (click)="editar(categoria.id)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button type="button" class="icon-btn danger" [attr.aria-label]="'Eliminar ' + categoria.nombre" (click)="eliminar(categoria.id)">
              <mat-icon>delete_outline</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr *ngIf="categorias.length === 0">
          <td [attr.colspan]="displayedColumns.length" class="empty">
            <mat-icon>category</mat-icon>
            <span>No se encontraron categorías.</span>
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      *ngIf="!loading"
      [length]="meta.totalCount"
      [pageSize]="meta.pageSize"
      [pageIndex]="meta.currentPage - 1"
      [pageSizeOptions]="[5, 10, 20, 50]"
      showFirstLastButtons
      (page)="cambiarPagina($event)">
    </mat-paginator>

  </mat-card>
</div>
